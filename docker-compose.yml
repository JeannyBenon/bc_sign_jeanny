services:
  postgres_db:
    image: postgres:16
    container_name: postgres_db
    restart: always
    environment:
      POSTGRES_USER: jeanny
      POSTGRES_PASSWORD: motdepasse123
      POSTGRES_DB: bc_sign_db
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data

  pgadmin:
    image: dpage/pgadmin4
    container_name: pgadmin
    restart: always
    environment:
      PGADMIN_DEFAULT_EMAIL: jeanny@example.com
      PGADMIN_DEFAULT_PASSWORD: motdepasse123
    ports:
      - "5050:80"
    depends_on:
      - postgres_db

volumes:
  postgres_data:
